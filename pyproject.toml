[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btk-downloader"
version = "1.0.0"
description = "BTK Akademi platformundan toplu ve seçmeli video ders indirme aracı"
readme = "README.md"
authors = [
    { name = "BTK Akademi Downloader Contributor" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "yt-dlp>=2023.3.4"
]

[project.scripts]
btk-downloader = "btk_downloader:main"
